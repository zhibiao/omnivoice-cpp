name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows CPU
            os: windows-2022
            configure_preset: windows-cpu
            build_preset: windows-cpu
            test_preset: windows-cpu-portable
          - name: Linux CPU
            os: ubuntu-latest
            configure_preset: linux-cpu
            build_preset: linux-cpu
            test_preset: linux-cpu-portable
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset ${{ matrix.configure_preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.build_preset }}
      - name: Test
        run: ctest --preset ${{ matrix.test_preset }}
